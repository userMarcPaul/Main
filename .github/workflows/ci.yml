name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Seed the local database
        run: npm run seed
        env:
          TURSO_DATABASE_URL: file:local.db
          TURSO_AUTH_TOKEN: ""
          ADMIN_EMAIL: ci@ecbeats.app

      - name: Run migrations
        run: npm run migrate
        env:
          TURSO_DATABASE_URL: file:local.db
          TURSO_AUTH_TOKEN: ""

      - name: Run all tests
        run: npm run test:all
        env:
          TURSO_DATABASE_URL: file:local.db
          TURSO_AUTH_TOKEN: ""
          ADMIN_EMAIL: ci@ecbeats.app
