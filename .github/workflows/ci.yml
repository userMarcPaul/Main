name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The npm scripts load .env.local (gitignored), so CI writes one with the
      # values a developer would use locally. Without it, `node --env-file`
      # aborts on the missing file before anything runs.
      - name: Create .env.local
        run: |
          printf 'TURSO_DATABASE_URL=file:local.db\nTURSO_AUTH_TOKEN=\nADMIN_EMAIL=ci@ecbeats.app\n' > .env.local

      - run: npm run seed
      - run: npm run migrate
      - run: npm run test:all
