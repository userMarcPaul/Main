name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The npm scripts load .env.local (gitignored); CI writes a minimal one.
      # The test suite currently skips unless a Supabase test project is wired
      # (see README → Tests). To run it for real, add SUPABASE_URL and
      # SUPABASE_SERVICE_ROLE_KEY as repo secrets, export them here, and set
      # ECB_LEGACY_SQLITE_TESTS is NOT used (those are the old SQLite tests).
      - name: Create .env.local
        run: printf 'ADMIN_EMAIL=ci@ecbeats.app\n' > .env.local

      - run: npm run test:all
