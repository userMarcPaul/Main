# Render Blueprint — defines the services Render creates for this app.
# See DEPLOYMENT.md for the full walkthrough.
#
# Secret values (marked `sync: false`) are NOT stored here — you type them into
# the Render dashboard once. Never put real keys in this file.

services:
  # The website + its /api endpoints, run as one long-lived Node server.
  - type: web
    name: ecb-eats
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
      # Name of the PUBLIC Supabase Storage bucket for uploaded recipe photos.
      - key: SUPABASE_STORAGE_BUCKET
        value: recipe-images

# Note: the daily cleanup is NOT a Render cron job — Render cron jobs have no
# free plan. It runs for free on GitHub Actions instead; see
# .github/workflows/cleanup.yml and DEPLOYMENT.md.
