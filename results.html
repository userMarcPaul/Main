<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Results — ECB Eats</title>
  <meta name="description" content="Search results for recipes on ECB Eats.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" href="assets/img/logo.png" type="image/png">
  <style>
    .search-results-section {
      padding: 48px 0 64px;
    }
    .search-results-header {
      margin-bottom: 32px;
    }
    .search-results-header h1 {
      font-family: var(--font-heading);
      font-size: 2rem;
      color: var(--text-dark);
      margin-bottom: 8px;
    }
    .search-results-header p {
      color: var(--text-secondary);
      font-size: 0.9375rem;
    }
    .result-card {
      display: flex;
      gap: 24px;
      padding: 24px 0;
      border-bottom: 1px solid var(--border-light);
      transition: var(--transition);
    }
    .result-card:hover {
      transform: translateX(6px);
    }
    .result-card:last-child {
      border-bottom: none;
    }
    .result-image {
      width: 160px;
      height: 120px;
      border-radius: var(--radius-md);
      overflow: hidden;
      flex-shrink: 0;
    }
    .result-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition-slow);
    }
    .result-card:hover .result-image img {
      transform: scale(1.05);
    }
    .result-body {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .result-category {
      font-size: 0.6875rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--coral);
      margin-bottom: 6px;
    }
    .result-title {
      font-family: var(--font-heading);
      font-size: 1.25rem;
      color: var(--text-dark);
      margin-bottom: 6px;
      transition: var(--transition-fast);
    }
    .result-card:hover .result-title {
      color: var(--coral);
    }
    .result-snippet {
      font-size: 0.875rem;
      color: var(--text-secondary);
      line-height: 1.6;
    }
    @media (max-width: 768px) {
      .result-card { flex-direction: column; gap: 12px; }
      .result-image { width: 100%; height: 180px; }
    }
  </style>
</head>
<body>

  <!-- ===== Site Header ===== -->
  <header class="site-header">
    <div class="header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">
          <div class="logo-icon-inner">
            <i class="fas fa-utensils"></i>
          </div>
        </div>
        <span class="logo-text">ECB Eats</span>
      </a>
      <div class="header-right">
        <div class="search-bar">
          <input type="text" placeholder="Search Recipes..." id="search-input">
          <button aria-label="Search"><i class="fas fa-search"></i></button>
        </div>
        <!-- Social links hidden until the accounts exist (see plan Phase 1) -->
        <div class="auth-area" id="auth-area" hidden></div>
      </div>
    </div>
  </header>

  <!-- ===== Main Navigation ===== -->
  <nav class="main-nav" aria-label="Main navigation">
    <div class="nav-inner">
      <button class="mobile-menu-toggle" aria-label="Toggle menu">
        <i class="fas fa-bars"></i>
      </button>
      <ul class="nav-links">
        <!-- Enabled in Phase 5: <li><a href="saved.html" class="nav-link"><i class="fas fa-heart heart-icon"></i> Saved Recipes</a></li> -->
        <li><a href="index.html" class="nav-link active">Recipes</a></li>
        <li><a href="index.html#categories" class="nav-link">By Category</a></li>
        <li><a href="index.html#latest" class="nav-link">Collections</a></li>
        <li><a href="profile.html" class="nav-link">About</a></li>
      </ul>
    </div>
  </nav>

  <!-- ===== Search Results ===== -->
  <section class="search-results-section">
    <div class="container">
      <div class="search-results-header">
        <h1 id="results-heading">Search Results</h1>
        <p id="results-summary"></p>
      </div>

      <div id="results"></div>
    </div>
  </section>

  <!-- ===== Footer ===== -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-top">
        <div class="footer-brand">
          <div class="logo-text">ECB Eats</div>
          <p>Inspiring culinary creativity — one recipe at a time.</p>
        </div>
        <div class="footer-nav">
          <h4>Explore</h4>
          <a href="index.html">Recipes</a>
          <a href="index.html#categories">Categories</a>
          <a href="index.html#latest">Collections</a>
          <a href="profile.html">About Us</a>
        </div>
      </div>
      <div class="footer-bottom">
        <p>&copy; <span class="footer-year">2024</span> ECB Eats. All rights reserved.</p>
        <!-- Social links hidden until the accounts exist (see plan Phase 1) -->
      </div>
    </div>
  </footer>

  <script type="module" src="assets/js/pages/results.js"></script>
</body>
</html>
